[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tar-lab"
version = "0.1.0"
description = "Trusted Autonomous Research Lab: a multi-agent, self-repairing research platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx2[socks]>=2.16,<3",
    "jsonschema>=4.20",
    "mcp>=2.3,<3",
    "prompt-toolkit>=3.0.53,<4",
    "rich>=15.0.0,<16",
]

[project.scripts]
tarlab = "tar_lab.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.0",
    "ruff>=0.15.2",
]

[tool.setuptools.packages.find]
include = ["tar_lab*"]

[tool.setuptools.package-data]
"tar_lab.figures" = ["requirements.in", "requirements.lock"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["engines"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = "^engines/"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["engines", ".git", ".venv", "build", "dist"]
