# Base defaults for the investigation CLI (python -m src.investigation.cli).
# Override with Hydra CLI overrides (key=value).

defaults:
  - _self_

run_id: null

agent:
  name: claude
  model: null
  profile: null
  reasoning_effort: null
  pool: []
  models: {}

paths:
  task_dir: examples/circpack
  results_dir: null
  global_memory_dir: null
  instruct: null
  # Interpreter of the task's own environment for official evaluations;
  # null -> <task_dir>/.venv/bin/python if it exists, else the engine's interpreter.
  task_python: null

execution:
  max_idea_cycles: 20
  resume: false
  max_program_evals_per_attempt: 4
  run_timeout_seconds: 21600
  idea_timeout_seconds: 3600
  max_idea_generation_attempts: 2
  run_timeout_grace_seconds: 30

logging:
  format: human
  verbose: false
  heartbeat_seconds: 60
  show_run_header: true
